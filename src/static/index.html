<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        
        <!-- Search, Filter, and Sort Toolbar -->
        <div id="toolbar" class="toolbar">
          <div class="toolbar-group">
            <input 
              type="text" 
              id="search-input" 
              placeholder="Search activities..." 
              class="toolbar-input"
            />
          </div>
          
          <div class="toolbar-group">
            <select id="category-filter" class="toolbar-select">
              <option value="">All Categories</option>
              <option value="Academic">Academic</option>
              <option value="Sports">Sports</option>
              <option value="Arts">Arts</option>
            </select>
          </div>
          
          <div class="toolbar-group">
            <select id="sort-select" class="toolbar-select">
              <option value="name">Sort by Name</option>
              <option value="schedule">Sort by Schedule</option>
              <option value="availability">Sort by Availability</option>
              <option value="popularity">Sort by Popularity</option>
            </select>
          </div>
          
          <button id="reset-btn" class="toolbar-button">Reset Filters</button>
        </div>
        
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
